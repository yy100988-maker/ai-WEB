# 本地/CI 测试用 compose：只起基础设施，端口映射到宿主机便于 vitest 直连
#
# 用法：docker compose -f docker-compose.test.yml up -d
#
# 注意端口与生产 compose 不同（避免与本机已装 PG/Redis 冲突）：
#   postgres 5433 / redis 6380 / minio 9000

services:
  postgres:
    image: postgres:16-alpine
    container_name: vutu-test-postgres
    environment:
      POSTGRES_USER: vutu
      POSTGRES_PASSWORD: vutu
      POSTGRES_DB: vutu
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vutu -d vutu"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data # 测试库放内存，快且无需清理

  redis:
    image: redis:7-alpine
    container_name: vutu-test-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: vutu-test-minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: vutuadmin
      MINIO_ROOT_PASSWORD: vutusecret
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vutuadmin vutusecret &&
      mc mb --ignore-existing local/vutu &&
      mc anonymous set none local/vutu &&
      echo 'bucket ready';
      "
    restart: "no"
