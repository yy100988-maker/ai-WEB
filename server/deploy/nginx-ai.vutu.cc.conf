# ai.vutu.cc —— vutu 前端 + Vutu 后端 API（同域反向代理，Cookie 无跨域问题）
#
# 拓扑：浏览器 → nginx:443 → /api/*  → 127.0.0.1:8080 (vutu api 容器)
#                        → /*      → 127.0.0.1:3000 (ai-cloner 前端)
#
# 安装：
#   sudo cp ai.vutu.cc.conf /etc/nginx/sites-available/ai.vutu.cc.conf
#   sudo ln -sf /etc/nginx/sites-available/ai.vutu.cc.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
  server_name ai.vutu.cc;

  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  # ---------------- 后端 API ----------------
  # `proxy_pass` 末尾**带**斜杠 + `rewrite`：把 /api/v1/xxx 剥成 /v1/xxx 再转发。
  # 这样后端只需注册一套 /v1/* 路由，无需感知反代前缀
  #（Fastify 5 在路由查找之后才执行 hook，无法在应用内改写 URL）。
  location /api/ {
    # $1 捕获 /api/ 之后的部分，拼成后端真实路径
    rewrite ^/api/(.*)$ /$1 break;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # ⚠️ 必须**覆写**（$remote_addr）而非追加（$proxy_add_x_forwarded_for）。
    # 追加会把客户端自带的 X-Forwarded-For 保留在最左，配合后端 trustProxy 取最左，
    # 即可伪造来源 IP —— 直接绕过全局限流与注册 IP 限流，并污染审计日志。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # SSE 必须关闭缓冲，否则进度推不下来（详细设计 §3.5）
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;

    # 请求体：JSON API 限制 2MB（文件走对象存储直传，不经此路径）
    client_max_body_size 2m;

    proxy_pass http://127.0.0.1:8080;
  }

  # 健康检查便捷入口（运营排查用）
  location = /api/health {
    proxy_pass http://127.0.0.1:8080/v1/health;
    access_log off;
  }

  # ---------------- 前端 ----------------
  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 同上：覆写而非追加（详见 /api/ location 的说明）
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://127.0.0.1:3000;
  }

  listen [::]:443 ssl; # managed by Certbot
  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/ai.vutu.cc/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/ai.vutu.cc/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = ai.vutu.cc) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  server_name ai.vutu.cc;
  listen 80;
  listen [::]:80;
  return 404; # managed by Certbot
}
